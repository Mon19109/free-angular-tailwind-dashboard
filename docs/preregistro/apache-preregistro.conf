# Dentro de <VirtualHost *:443> en default-ssl.conf.
# Requiere mod_proxy y mod_proxy_http. Colocar antes de cualquier proxy genérico.
# Solo estas rutas son API: /preregistro (sin sufijo) sigue siendo navegación Angular.
ProxyPass        "/preregistro/validar" "http://127.0.0.1:3000/bff/preregistro/afiliacion/validar"
ProxyPassReverse "/preregistro/validar" "http://127.0.0.1:3000/bff/preregistro/afiliacion/validar"
ProxyPass        "/preregistro/registro-completo" "http://127.0.0.1:3000/bff/preregistro/registro-completo"
ProxyPassReverse "/preregistro/registro-completo" "http://127.0.0.1:3000/bff/preregistro/registro-completo"
ProxyPass        "/preregistro/actividades" "http://127.0.0.1:3000/bff/preregistro/catalogos/actividades"
ProxyPassReverse "/preregistro/actividades" "http://127.0.0.1:3000/bff/preregistro/catalogos/actividades"
ProxyPass        "/preregistro/regimenes-fiscales" "http://127.0.0.1:3000/bff/preregistro/catalogos/regimenes-fiscales"
ProxyPassReverse "/preregistro/regimenes-fiscales" "http://127.0.0.1:3000/bff/preregistro/catalogos/regimenes-fiscales"
ProxyPass        "/preregistro/tipos-comercio" "http://127.0.0.1:3000/bff/preregistro/catalogos/tipos-comercio"
ProxyPassReverse "/preregistro/tipos-comercio" "http://127.0.0.1:3000/bff/preregistro/catalogos/tipos-comercio"
ProxyPass        "/preregistro/localidades/" "http://127.0.0.1:3000/bff/preregistro/catalogos/localidades/"
ProxyPassReverse "/preregistro/localidades/" "http://127.0.0.1:3000/bff/preregistro/catalogos/localidades/"
ProxyPass        "/preregistro/giros" "http://127.0.0.1:3000/bff/preregistro/catalogos/giros"
ProxyPassReverse "/preregistro/giros" "http://127.0.0.1:3000/bff/preregistro/catalogos/giros"
ProxyPass        "/preregistro/instituciones" "http://127.0.0.1:3000/bff/preregistro/catalogos/instituciones"
ProxyPassReverse "/preregistro/instituciones" "http://127.0.0.1:3000/bff/preregistro/catalogos/instituciones"

# Si existe un RewriteRule de fallback a index.html EN EL VIRTUALHOST,
# agregar esta condición INMEDIATAMENTE antes de ese RewriteRule (junto a sus otras condiciones):
# RewriteCond %{REQUEST_URI} !^/preregistro/(validar|registro-completo|actividades|regimenes-fiscales|tipos-comercio|giros|instituciones|localidades)(/|$)
# Si el fallback está en .htaccess, revisar la condición equivalente en ese contexto.
# No agregar ProxyPass /preregistro/ ni ProxyPass /: capturarían las páginas Angular.
# Si ya existe el par /preregistro/validar indicado por el usuario, conservarlo una sola vez.
