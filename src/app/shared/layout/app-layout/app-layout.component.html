<div class="app-shell min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="app-main flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'sidebar-expanded': (isExpanded$ | async) || (isHovered$ | async),
        'sidebar-collapsed': !((isExpanded$ | async) || (isHovered$ | async)),
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="app-content p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
