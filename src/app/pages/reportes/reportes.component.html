<section class="reportes-shell">
  <p class="reportes-intro">Seleccione los filtros y el reporte que desee consultar</p>

  <form class="reportes-filter" (ngSubmit)="consultar()">
    <label class="reportes-field">
      <span>Selecciona Cuenta</span>
      <select class="reportes-control" [(ngModel)]="cuentaSeleccionada" name="cuenta" (change)="onCuentaChange()">
        <option value=""></option>
        <option *ngFor="let cuenta of cuentas" [value]="cuenta.id">
          {{ cuenta.texto }}
        </option>
      </select>
    </label>

    <label class="reportes-field">
      <span>Periodo</span>
      <select class="reportes-control" [(ngModel)]="periodoSeleccionado" name="periodo">
        <option value=""></option>
        <option *ngFor="let periodo of periodos" [value]="periodo">
          {{ periodo }}
        </option>
      </select>
    </label>

    <div class="reportes-actions">
      <button type="submit" class="reportes-consultar" [disabled]="cargando">
        <i class="fas fa-search"></i>
        CONSULTAR
      </button>
    </div>
  </form>

  <div *ngIf="mensaje" class="reportes-message">
    {{ mensaje }}
  </div>

  <div *ngIf="mostrarReportes" class="reportes-grid">
    <article
      *ngFor="let reporte of reportes"
      class="reporte-card"
      [class.reporte-card-pdf]="reporte.variante === 'pdf'"
      [class.reporte-card-excel]="reporte.variante === 'excel'"
      [class.reporte-card-corte]="reporte.variante === 'corte'"
      [class.reporte-card-diario]="reporte.variante === 'diario'"
      [class.reporte-card-split]="reporte.variante === 'split'"
      [class.reporte-card-liquidacion]="reporte.variante === 'liquidacion'"
      [class.reporte-card-bancos]="reporte.variante === 'bancos'"
      [class.reporte-card-comision]="reporte.variante === 'comision'"
      [class.reporte-card-conciliacion]="reporte.variante === 'conciliacion'"
      [class.reporte-card-internacional]="reporte.variante === 'internacional'"
      [class.reporte-card-reserva]="reporte.variante === 'reserva'">
      <div class="reporte-icon">
        <img [src]="reporte.imagen" [alt]="reporte.titulo" />
      </div>

      <h3>{{ reporte.titulo }}</h3>

      <div class="reporte-divider"></div>

      <p>{{ reporte.descripcion }}</p>

      <button type="button" class="reporte-button" [disabled]="abriendoReporte === reporte.id" (click)="verReporte(reporte)">
        <i class="fas" [ngClass]="abriendoReporte === reporte.id ? 'fa-spinner fa-spin' : 'fa-file-alt'"></i>
        {{ abriendoReporte === reporte.id ? 'ABRIENDO...' : 'VER REPORTE' }}
        <i class="fas fa-chevron-right"></i>
      </button>
    </article>
  </div>
</section>
