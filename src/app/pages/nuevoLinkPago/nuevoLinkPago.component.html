<section class="edit-link-shell page-container">
  <article class="edit-link-card">
    <header class="edit-link-header">
      <div>
        <span class="eyebrow">Pago a distancia</span>
        <h1>Editar link de pago</h1>
      </div>
      <a routerLink="/pago_distancia" class="button secondary">Regresar</a>
    </header>

    @if (cargando) {
      <div class="state-panel">Cargando información del link...</div>
    } @else if (mensajeError) {
      <div class="state-panel error">{{ mensajeError }}</div>
    } @else {
      <form
        [formGroup]="formulario"
        id="form_addlinkpago"
        class="edit-link-body"
        (ngSubmit)="continuar()">
        @if (mensajeResultado) {
          <div class="result-message" [class.error]="resultadoEsError" role="status">
            {{ mensajeResultado }}
          </div>
        }
        <section class="form-panel">
          <div class="form-grid">
            <div class="form-field">
              <label for="tel">Número de teléfono móvil*</label>
              <input id="tel" type="tel" maxlength="10" formControlName="tel">
            </div>

            <div class="form-field">
              <label for="email">Correo Electrónico*</label>
              <input id="email" type="email" formControlName="email">
            </div>

            <div class="form-field">
              <label for="tnoti">Tipo de notificación*</label>
              <select id="tnoti" formControlName="tipoNotificacion">
                <option value="">Selecciona notificación</option>
                @for (opcion of tiposNotificacion; track opcion.value) {
                  <option [value]="opcion.value">{{ opcion.label }}</option>
                }
              </select>
            </div>

            <div class="form-field">
              <label for="nombre">Nombre*</label>
              <input id="nombre" type="text" formControlName="nombre">
            </div>

            <div class="form-field">
              <label for="apaterno">Apellido Paterno*</label>
              <input id="apaterno" type="text" formControlName="apellidoPaterno">
            </div>

            <div class="form-field">
              <label for="amaterno">Apellido Materno*</label>
              <input id="amaterno" type="text" formControlName="apellidoMaterno">
            </div>

            <div class="form-field">
              <label for="productos">Productos</label>
              <div class="tags-input">
                @for (producto of productos; track producto) {
                  <span class="product-tag">
                    {{ producto }}
                    <button type="button" (click)="eliminarProducto(producto)" aria-label="Eliminar producto">
                      &times;
                    </button>
                  </span>
                }
                <input
                  id="productos"
                  type="text"
                  [value]="productoEntrada"
                  (input)="productoEntrada = $any($event.target).value"
                  (keydown)="agregarProducto($event)"
                  (blur)="agregarProducto()"
                  placeholder="Escribe y separa con coma o Enter">
              </div>
            </div>

            <div class="form-field">
              <label for="referencia">Referencia del comercio*</label>
              <input id="referencia" type="text" maxlength="6" formControlName="referenciaComercio">
            </div>

            <div class="form-field">
              <label for="ref1">Referencia 1*</label>
              <input id="ref1" type="text" formControlName="referenciaUno">
            </div>

            <div class="form-field">
              <label for="ref2">Referencia 2*</label>
              <input id="ref2" type="text" formControlName="referenciaDos">
            </div>

            <div class="form-field">
              <label for="concepto">Concepto*</label>
              <input id="concepto" type="text" formControlName="concepto">
            </div>

            <div class="form-field">
              <label for="datepicker">Fecha de vencimiento*</label>
              <input id="datepicker" type="date" formControlName="fechaVencimiento">
            </div>

            <div class="form-field">
              <label for="fpago">Forma de pago*</label>
              <select id="fpago" formControlName="metodoPago">
                <option value="">Selecciona forma de pago</option>
                @for (opcion of metodosPago; track opcion.value) {
                  <option [value]="opcion.value">{{ opcion.label }}</option>
                }
              </select>
            </div>

            <div class="form-field">
              <label for="monto">Monto*</label>
              <input id="monto" type="number" min="0.01" step="0.01" formControlName="monto">
            </div>

            <label class="switch-field" for="fr2">
              <input id="fr2" type="checkbox" formControlName="msi">
              <span>Meses sin intereses</span>
            </label>

            <label class="switch-field" for="fr1">
              <input id="fr1" type="checkbox" formControlName="propina">
              <span>Propina</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="button primary" [disabled]="actualizando">
              {{ actualizando ? 'Actualizando...' : 'Enviar' }}
            </button>
          </div>
        </section>
      </form>
    }
  </article>
</section>
