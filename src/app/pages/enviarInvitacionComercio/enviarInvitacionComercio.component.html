<main class="invitation-shell page-container">
  <article class="invitation-card">
    <header class="invitation-card-header">
      <div>
        <span class="eyebrow">Comercios</span>
        <h1>Enviar invitación a comercio</h1>
      </div>
    </header>

    <section class="invitation-card-body">
      <p class="intro">
        Genera más Comisiones, envia una invitación a un nuevo comercio para ser parte de Kashpay.
      </p>

      <form class="invitation-form" (ngSubmit)="continuar()">
        <label class="form-field">
          <span>Correo Electrónico*</span>
          <input
            type="email"
            name="correoElectronico"
            [(ngModel)]="correoElectronico"
            [disabled]="cargando"
            autocomplete="email" />
        </label>

        <label class="form-field">
          <span>Nombre:</span>
          <input
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            [disabled]="cargando"
            autocomplete="name" />
        </label>

        <div class="actions">
          <button type="submit" class="button primary" [disabled]="cargando">
            {{ cargando ? 'Enviando...' : 'Continuar' }}
          </button>
          <button type="button" class="button secondary" [disabled]="cargando" (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </section>
  </article>
</main>

<div class="invitation-modal-backdrop" *ngIf="mostrarModalResultado" (click)="cerrarModalResultado()">
  <section
    class="invitation-modal"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="invitation-result-title"
    aria-describedby="invitation-result-message"
    (click)="$event.stopPropagation()">
    <div class="invitation-modal-body">
      <i
        class="far invitation-modal-icon"
        [class.fa-check-circle]="tipoResultado === 'exito'"
        [class.fa-times-circle]="tipoResultado === 'error'"
        [class.error]="tipoResultado === 'error'"
        aria-hidden="true"></i>
      <h2 id="invitation-result-title">{{ tituloResultado }}</h2>
      <p id="invitation-result-message">{{ mensajeResultado }}</p>
    </div>
    <footer class="invitation-modal-footer">
      <button type="button" class="button primary invitation-modal-ok" (click)="cerrarModalResultado()" autofocus>
        OK
      </button>
    </footer>
  </section>
</div>
